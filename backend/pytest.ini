[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -ra -p no:cacheprovider
markers =
    caso_normal: flujo esperado con datos validos
    caso_error: entradas invalidas o accesos no permitidos
    caso_limite: valores frontera (minimos, maximos, justo fuera de rango)
    regla_negocio: validaciones logicas o de negocio de AgroIA
    defecto_conocido: defecto real detectado por las pruebas y aun sin corregir
